      <ellipse rx="141" ry="89" stroke="#476d56" stroke-width="1.5" fill="none"/>
      <path d="M-155 49C-198-19-127-130-29-120C27-114 50-68 68-16L90 45C105 85 148 82 165 46C193-14 157-86 99-102" fill="none" stroke="url(#ribbonShade)" stroke-width="39"/>
      <path d="M-155 36C-196-31-124-138-29-128C25-122 47-78 66-28L88 33C103 73 145 70 161 35C187-24 152-98 94-113" fill="none" stroke="url(#ribbon)" stroke-width="31"/>
      <path d="M-144-50C-177 6-139 95-71 106C-9 116 20 72 40 25L65-35C82-77 124-75 145-41C175 13 154 83 104 108" fill="none" stroke="#2a6550" stroke-width="38"/>
      <path d="M-144-62C-177-6-139 83-71 94C-9 104 20 60 40 13L65-47C82-89 124-87 145-53C175 1 154 71 104 96" fill="none" stroke="url(#ribbon)" stroke-width="30"/>
      <path d="M-144-65C-172-12-139 77-71 88" fill="none" stroke="#edffc9" stroke-opacity=".7" stroke-width="2"/>
      <path d="M-155 29C-193-34-124-132-29-123" fill="none" stroke="#edffc9" stroke-opacity=".6" stroke-width="2"/>
    </g>

    <g fill="#ceff76">
      <circle cx="941" cy="346" r="5"/><circle cx="1336" cy="114" r="5"/>
      <circle cx="941" cy="346" r="9" opacity=".5" filter="url(#glow)"/>
      <circle cx="1336" cy="114" r="9" opacity=".5" filter="url(#glow)"/>
    </g>
    <g font-family="'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace">
      <rect x="76" y="57" width="8" height="8" rx="2" fill="#c6ff63"/>
      <text x="98" y="67" fill="#b5c2b3" font-size="14" font-weight="600" letter-spacing="2.4">LOCAL GATEWAY / OPEN SOURCE</text>
      <text x="70" y="226" font-size="104" font-weight="700" letter-spacing="-6"><tspan fill="#f4f6ed">val</tspan><tspan fill="#c6ff63">2</tspan><tspan fill="#f4f6ed">harness</tspan></text>
      <text x="78" y="285" fill="#c7d0c4" font-size="25" letter-spacing="-.7">Your Val. Connected to what’s next.</text>
      <rect x="77" y="345" width="274" height="40" rx="20" fill="#c6ff63" fill-opacity=".08" stroke="#c6ff63" stroke-opacity=".24"/>
      <text x="214" y="370" fill="#d8ecc1" font-size="13" text-anchor="middle" letter-spacing=".6">OPENAI CHAT COMPLETIONS</text>
      <rect x="365" y="345" width="244" height="40" rx="20" fill="#c6ff63" fill-opacity=".08" stroke="#c6ff63" stroke-opacity=".24"/>
      <text x="487" y="370" fill="#d8ecc1" font-size="13" text-anchor="middle" letter-spacing=".6">ANTHROPIC MESSAGES</text>
      <text x="79" y="441" fill="#708274" font-size="11" letter-spacing="2">YOUR ACCOUNT. YOUR TOOLS. YOUR DATA.</text>
