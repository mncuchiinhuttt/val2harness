<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">val2harness — Your Val, connected</title>
  <desc id="description">A bold val2harness wordmark and luminous interlocking ribbons on a charcoal background. A local gateway for OpenAI Chat Completions and Anthropic Messages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101610"/><stop offset=".55" stop-color="#0c1114"/><stop offset="1" stop-color="#141d1a"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#9bc85b" stop-opacity=".24"/><stop offset="1" stop-color="#9bc85b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#f0ffc1"/><stop offset=".28" stop-color="#c6ff63"/><stop offset=".68" stop-color="#78db92"/><stop offset="1" stop-color="#3daaa0"/>
    </linearGradient>
    <linearGradient id="ribbonShade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9fdd49"/><stop offset=".5" stop-color="#367a5d"/><stop offset="1" stop-color="#173b35"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#caff70" stop-opacity="0"/><stop offset=".5" stop-color="#caff70" stop-opacity=".8"/><stop offset="1" stop-color="#caff70" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#a8c4b0" opacity=".12"/>
    </pattern>
    <clipPath id="frame"><rect width="1440" height="480" rx="24"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1440" height="480" fill="url(#background)"/>
    <rect x="790" width="650" height="480" fill="url(#dots)"/>
    <ellipse cx="1150" cy="223" rx="355" ry="310" fill="url(#ambient)"/>
    <path d="M850 0 642 480M884 0 676 480" fill="none" stroke="#bedba8" stroke-opacity=".055"/>
    <path d="M0 479.5H1440" stroke="url(#edge)"/>

    <g fill="none" stroke="#93b7a5" stroke-opacity=".17">
      <ellipse cx="1144" cy="229" rx="230" ry="165" transform="rotate(-25 1144 229)"/>
      <ellipse cx="1144" cy="229" rx="256" ry="191" transform="rotate(-25 1144 229)" stroke-dasharray="2 10"/>
      <path d="M865 229H1420M1144 14V444" stroke-opacity=".1"/>
    </g>

    <g transform="translate(1144 229) rotate(-25)">
